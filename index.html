<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e27">
  <meta name="description" content="Smart AI-powered live football predictor - توقعات ذكية لرهانات المباريات اللايف">
  <title>⚽ التوقعات الذكية | Smart Live Predictor AI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">⚽</div>
        <div>
          <div class="logo-text" id="appName">التوقعات الذكية</div>
          <div style="font-size:0.7rem;color:var(--gray);font-weight:500" id="tagline">AI للرهانات اللايف</div>
        </div>
      </div>
      <button class="lang-switch" id="langSwitch">EN</button>
    </div>
  </header>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span>LIVE • <span id="lastUpdate">--:--</span></span>
    </div>
    <button class="refresh-btn" id="refreshBtn">
      <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <span id="refreshBtnText">تحديث</span>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="live">مباريات لايف</button>
    <button class="tab" data-tab="upcoming">قادمة</button>
    <button class="tab" data-tab="finished">منتهية</button>
  </div>

  <!-- Matches -->
  <main class="matches-container">
    <div id="matchesContainer">
      <div class="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">جاري تحليل المباريات...</div>
      </div>
    </div>
  </main>

  <!-- Footer / Disclaimer -->
  <footer class="footer">
    <p id="disclaimer">⚠️ تنبيه: هذه التوقعات لأغراض التحليل والترفيه فقط.</p>
  </footer>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- App -->
  <script src="app.js"></script>
</body>
</html>
